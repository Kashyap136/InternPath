# Render Blueprint — InternPath backend (Express + Prisma) for the hosted
# academic demonstration. The frontend is deployed separately on Vercel and
# reaches this service only through its same-origin `/api/backend` rewrite.
#
# Secrets are NEVER stored here: `sync: false` keys are entered in the Render
# dashboard when the Blueprint is applied; `generateValue` keys are random
# values generated by Render. See docs/07-final/InternPath_Tonight_Deployment_Report.md.
services:
  - type: web
    name: internpath-api
    runtime: node
    plan: free
    rootDir: .
    # npm workspaces: the single lockfile lives at the repo root. `--include=dev`
    # is required because prisma/typescript are devDependencies and NODE_ENV is
    # production at build time. No seed runs here.
    buildCommand: >-
      npm ci --include=dev --workspace=@internpath/backend --include-workspace-root &&
      npm run build --workspace=@internpath/backend
    # Committed Prisma migrations are applied on every start, BEFORE the server
    # boots, so deployed code never runs against an older schema (that mismatch
    # broke Google sign-in after the email-verification release). `prisma
    # migrate deploy` only applies committed, not-yet-applied migrations — it
    # never resets data. preDeployCommand is unavailable on the free plan, hence
    # the start command. A migration failure is logged loudly but does not stop
    # the server from starting, so a bad migration cannot take the API offline.
    startCommand: >-
      npx prisma migrate deploy --schema backend/prisma/schema.prisma ||
      echo "WARNING: prisma migrate deploy FAILED - schema may be out of date";
      node backend/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Supabase SESSION POOLER connection string (IPv4; Render has no IPv6
      # egress, so the direct db.<ref>.supabase.co host does not work). Must
      # point at the dedicated demonstration database — never internpath_dev.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Exact Vercel production origin, e.g. https://internpath-xyz.vercel.app
      # (no trailing slash). Used for CORS, OAuth callback default and links.
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # All browser traffic arrives via the Vercel rewrite, so the global
      # limiter (trust proxy = 1 hop, deliberately NOT raised: more hops would
      # let direct callers spoof X-Forwarded-For) sees Vercel egress addresses.
      # Raise the shared global budget (OD-9); the per-account auth limiter
      # (10 failed / 15 min) is unchanged.
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "600"
      # Email (verification + password-reset codes) is sent through the
      # Gmail API over HTTPS: Render's free plan blocks outbound SMTP ports
      # 25/465/587 (since 2025-09), so SMTP is deliberately NOT configured
      # here. See backend/.env.example ("Gmail API") for obtaining the token.
      # GOOGLE_CLIENT_ID/SECRET (already set for Google sign-in) are reused.
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Must be the same Gmail address that authorised the refresh token,
      # e.g. "InternPath <internpath.notifications@gmail.com>".
      - key: EMAIL_FROM
        sync: false
